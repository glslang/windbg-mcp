[package]
name = "windbg-mcp"
version = "0.14.0"
edition = "2024"
# Not published to crates.io — these are here because `build.rs` stamps them into the binary's PE
# version resource, which is what Explorer's properties dialog and Defender's ML scoring read
# (`FOLLOWUPS.md` item 50). The description is the short one, from `server.json`.
description = "WinDbg/DbgEng over MCP: crash dumps, live user & kernel, driver IOCTLs, and TTD."
repository = "https://github.com/glslang/windbg-mcp"
license = "MIT"

[dependencies]
dbgscope = { git = "https://github.com/glslang/dbgscope", rev = "fb5828c5f9f62e2e00aed20190ee37fa60b1791e" }
# 3.1.1 is a floor, not a preference: every 3.x before it generates a `tools/list` that omits
# SEP-2549's required `ttlMs`/`cacheScope`, which a spec-strict `2026-07-28` client rejects
# outright — the server connects and appears to expose no tools at all (upstream issue #1114).
rmcp = { version = "3.1.1", features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
    # The listener (`--listen`, see `src/listen.rs`). `-session` is what makes a client's MCP
    # session an addressable thing with a close of its own, which is what a lease is hung off.
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "sync", "time"] }
# The listener's HTTP plumbing, and nothing more: rmcp's `StreamableHttpService` is a plain
# request-to-response handler, so what is missing is a server to call it. hyper rather than a
# framework because one route with one middleware (the bearer check) is not a router's worth of
# work — see `src/listen.rs`.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
# Bodies for the listener's own responses (401/409): rmcp hands back a boxed body, so refusing a
# request needs one of the same shape.
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Two things std cannot express. The handle plumbing behind the supervisor↔worker channel (see
# `engine::spawn_worker`): marking a pipe end inheritable. And CNG (`Win32_Security_Cryptography`),
# for the two credential primitives in `src/client.rs` — a token generated from the system RNG, and
# the SHA-256 fingerprint that is the only thing a client command may print about one. Both are
# one-shot calls against pseudo-handles, which is why this pulls in no crypto crate.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # `GetConsoleProcessList`, which is how `engine::attached_to_a_console` answers whether a
    # child this server spawns has a console to inherit — and therefore whether it would open a
    # window of its own. The obvious `GetConsoleWindow` is in the same feature and is the wrong
    # call: a ConPTY console has no window (issue #273).
    "Win32_System_Console",
    "Win32_System_Threading",
    # `IsWow64Process2`, which is how `src/target.rs` reads the architecture of a *live* process
    # before a worker is spawned for it. The call itself is in `Win32_System_Threading` above; this
    # feature is here for its `IMAGE_FILE_MACHINE` out-parameters, which are gated by module path
    # rather than by subject — the same trap `CLAUDE.md` records for `IMAGE_NT_HEADERS64`.
    "Win32_System_SystemInformation",
] }
# The Windows service role (`src/service.rs`). A wrapper rather than hand-rolled SCM FFI because
# that lifecycle is the one part of this which must not be subtly wrong: a service that mishandles
# its stop is a service that cannot be stopped, and for this server that means a live kernel target
# left frozen. Small and focused — it pulls in no framework behind it.
windows-service = "0.8"

[build-dependencies]
# The PE version resource (`build.rs`), which is item 50's cheap half: a Rust binary carries none by
# default, and an empty `FileVersion`/`CompanyName`/`ProductName` is one of the two causes Microsoft
# names for the `Bearfoos.B!ml` verdict this binary has drawn. Default features off drops its `toml`
# dependency, whose only job is reading a `[package.metadata.winresource]` table — the fields are
# set from `build.rs` instead, because one of them is the git revision only that script computes.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
# `Win32_Storage_FileSystem` for `GetFileVersionInfoW`, so `mcp_smoke` can read the PE version
# resource back off the exe it just built. A dev-dependency rather than a feature on the entry
# above: the edition-2024 resolver does not unify these into a normal build, so the shipped
# binary's `windows-sys` surface is unchanged by a test wanting to check the metadata.
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    # `GetConsoleProcessList`, so the debugger tier can assert that a real session's engine
    # worker is attached to *this* console rather than one of its own (issue #273).
    "Win32_System_Console",
] }
# `test-util` only, and only for the tests: `src/progress.rs` asserts on a heartbeat measured in
# tens of seconds, and the alternative — real sleeps shrunk to milliseconds — is a test that fails
# on a loaded runner for reasons that have nothing to do with the code. A paused clock makes the
# timing exact. Kept out of the shipped binary by the edition-2024 resolver, which does not unify
# dev-dependency features into a normal build.
tokio = { version = "1", features = ["test-util"] }

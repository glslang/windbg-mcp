[package]
name = "windbg-mcp"
version = "0.2.1"
edition = "2024"

[dependencies]
win-kexp = { git = "https://github.com/glslang/win-kexp", branch = "main" }
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The end-to-end smoke test (`tests/mcp_smoke.rs`) drives the built binary over stdio with
# hand-written JSON-RPC, so it needs a JSON parser and nothing else — deliberately no new
# crates, since it is the test you reach for when a dependency has just broken something.
[dev-dependencies]
serde_json = "1"

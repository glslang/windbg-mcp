[package]
name = "windbg-mcp"
version = "0.5.0"
edition = "2024"

[dependencies]
win-kexp = { git = "https://github.com/glslang/win-kexp", branch = "main" }
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only for the handle plumbing behind the supervisor↔worker channel (see `engine::spawn_worker`):
# marking a pipe end inheritable is the one thing std cannot express.
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

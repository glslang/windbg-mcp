[package]
name = "windbg-mcp"
version = "0.10.0"
edition = "2024"

[dependencies]
win-kexp = { git = "https://github.com/glslang/win-kexp", rev = "7b7040e048dd11a93d8bac880b4802efb9ec07e2" }
# 3.1.1 is a floor, not a preference: every 3.x before it generates a `tools/list` that omits
# SEP-2549's required `ttlMs`/`cacheScope`, which a spec-strict `2026-07-28` client rejects
# outright — the server connects and appears to expose no tools at all (upstream issue #1114).
rmcp = { version = "3.1.1", features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
    # The listener (`--listen`, see `src/listen.rs`). `-session` is what makes a client's MCP
    # session an addressable thing with a close of its own, which is what a lease is hung off.
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "sync", "time"] }
# The listener's HTTP plumbing, and nothing more: rmcp's `StreamableHttpService` is a plain
# request-to-response handler, so what is missing is a server to call it. hyper rather than a
# framework because one route with one middleware (the bearer check) is not a router's worth of
# work — see `src/listen.rs`.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
# Bodies for the listener's own responses (401/409): rmcp hands back a boxed body, so refusing a
# request needs one of the same shape.
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only for the handle plumbing behind the supervisor↔worker channel (see `engine::spawn_worker`):
# marking a pipe end inheritable is the one thing std cannot express.
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
# The Windows service role (`src/service.rs`). A wrapper rather than hand-rolled SCM FFI because
# that lifecycle is the one part of this which must not be subtly wrong: a service that mishandles
# its stop is a service that cannot be stopped, and for this server that means a live kernel target
# left frozen. Small and focused — it pulls in no framework behind it.
windows-service = "0.8"

[dev-dependencies]
# `test-util` only, and only for the tests: `src/progress.rs` asserts on a heartbeat measured in
# tens of seconds, and the alternative — real sleeps shrunk to milliseconds — is a test that fails
# on a loaded runner for reasons that have nothing to do with the code. A paused clock makes the
# timing exact. Kept out of the shipped binary by the edition-2024 resolver, which does not unify
# dev-dependency features into a normal build.
tokio = { version = "1", features = ["test-util"] }

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Kept for re-running a tier by hand — the debugger tier after a flaky runner, say. It is no
  # longer what gates that tier; see the `smoke-debugger` job.
  workflow_dispatch:

concurrency:
  # A superseded push or PR update should cancel its predecessor — but a manual dispatch should
  # not take part in that at all. It shares `github.ref` with the branch's own CI (on `main`,
  # with the push run), so a shared group would have the two cancel each other, and a repeat
  # dispatch would kill the debugger-tier run someone had just asked for. Keying dispatches by
  # run id gives each one a group of its own: never cancelled, never cancelling.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a master-history SHA (per the action's README — toolchain
        # branch commits get force-pushed), so the toolchain comes from the
        # input, not the ref.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --release

      # The 32-bit worker. A 32-bit user dump needs a 32-bit engine, which needs a 32-bit
      # *process*, so the supervisor spawns this image instead of re-executing itself
      # (`engine::worker_images`). It is the same crate with nothing but the target changed, and
      # nothing else here would notice it stopping compiling: every other job builds the runner's
      # own architecture.
      - name: Build the 32-bit worker
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc

      # Includes the smoke test's protocol tier (tests/mcp_smoke.rs), which drives the built
      # binary over stdio. That tier needs no debugger, target, or network; the debugger tier
      # is gated behind WINDBG_MCP_SMOKE_DUMP and runs in the `smoke-debugger` job below.
      - name: Test
        run: cargo test

      - name: Validate plugin manifests
        shell: pwsh
        run: |
          # Guard against malformed plugin/marketplace manifests (the JSON that
          # tells the marketplace how to install this plugin).
          foreach ($f in '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json') {
            Write-Host "Validating $f"
            Get-Content $f -Raw | ConvertFrom-Json | Out-Null
          }

  smoke-debugger:
    name: Smoke test (debugger tier${{ matrix.suffix }})
    # Runs on every push and PR, not on demand.
    #
    # It was on-demand while the risk (a Windows-image change breaking it for reasons unrelated
    # to the PR under review) outweighed what it covered. Process-per-session changed that side
    # of the scale: this tier is now the only automated check of the properties the architecture
    # exists for — two sessions coexisting, a parked attach being reclaimed while another session
    # works, no engine worker outliving the connection — and none of those depend on the image.
    # It needs no symbols and no network, and the dump it opens is checked in.
    #
    # The risk it was hedging against is still real, and the answer to it is that a runner whose
    # DbgEng cannot open a checked-in dump is something this repo wants to hear about: it breaks
    # users the same way. If that happens, pin the failure here rather than in a bug report.
    #
    # Both architectures, because that argument applies to each of them separately and the ARM64
    # one had nothing behind it: it was a claim about a `dbgeng.dll` this project does not ship and
    # cannot test any other way, resting on one manual session (issue #134).
    #
    # The four assertions that read a *target* rather than the dump around it open the sample
    # matching the runner's architecture — an ARM64 dump is checked in for this entry (issue #143)
    # — and check first that this runner has what each of them needs: `nt`'s base reading, plus a
    # resolved PDB for the two that walk `nt`'s types. A kernel dump's pointers are followed
    # through structures the engine locates with those symbols, and a runner that resolves none
    # reads the dump's own structure and nothing behind it. The two conditions are asked
    # separately because they fail apart — this entry is where that was learned, by reading a
    # module base and then failing a stack walk. That, and not the architecture pairing it was
    # first read as, is issue #142. What decides whether a runner resolves anything is
    # `symsrv.dll`, and the images differ in whether they have one: that is what the copy step
    # below is for, and why it runs on the ARM64 entries only (issue #153). Those four print
    # `SKIPPED` with the reason where it happens, so a green run here never claims more than it
    # checked.
    #
    # Only this tier is matrixed. The crate is architecture-independent Rust, so `fmt`, clippy and
    # the unit tests in `build` have no reason to differ and a second entry there would buy runtime
    # rather than coverage. What differs on ARM64 is the *engine*, and this is the job that loads
    # one.
    strategy:
      # An ARM64 failure must not cancel the x64 run: x64 is the result this repo has trusted for
      # every release, and a new runner label is exactly the thing most likely to be flaky first.
      # For the same reason neither ARM64 entry may cancel the other — the whole point of running
      # both images is to see which of them a failure belongs to.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            # Empty, so this entry's check keeps the exact name `Smoke test (debugger tier)`.
            # That string is a *required status check* in the repository ruleset, and a required
            # context is matched by name: renaming the job does not rename the requirement, it
            # removes the only job that could ever satisfy it — and every PR in the repo blocks on
            # a check that will never report again. Adding a matrix is not a rename as long as one
            # entry keeps the original name.
            suffix: ""
          - arch: arm64
            runner: windows-11-arm
            suffix: ", arm64"
          # The image behind `windows-11-arm` is being replaced under it. The Visual Studio 2026
          # ARM64 image went generally available on 2026-08-20 as `windows-11-vs2026-arm`, and
          # GitHub migrates the `windows-11-arm` label onto it between 21 and 30 September 2026.
          # What that changes for this job is not the compiler — the crate is Rust, and the x64
          # entry has been building against a VS2026 image ever since `windows-latest` migrated —
          # but the **OS build**, and with it the inbox `dbgeng.dll` that this entry exists to
          # load: 10.0.26200.9168 against .8875 when this was written. So run the new label now,
          # while the old one is still beside it to compare against. A break that only the new
          # image has is one this repo would otherwise meet on the migration date, on every PR at
          # once, with nothing green next to it to say which half moved.
          #
          # This entry has an expiry: once the migration completes, the two labels name the same
          # image and the pair buys a second run of the same thing. Drop the older entry then
          # (`FOLLOWUPS.md` item 32).
          - arch: arm64
            runner: windows-11-vs2026-arm
            suffix: ", arm64 vs2026"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keyed by runner label rather than by architecture, or entries share one cache and
          # each restores another's target directory — objects for the wrong triple across the two
          # architectures, and a target directory linked by a different MSVC across the two ARM64
          # images. Rebuilt every run at best.
          key: ${{ matrix.runner }}

      # `cargo test` builds this itself; doing it as its own step is what gives the copy below
      # somewhere to copy *to*.
      - name: Build the binary under test
        run: cargo build

      # Measured, not assumed (issue #153): `windows-latest` carries `symsrv.dll` in System32
      # beside the `dbghelp.dll` that ships there, so its stock engine reaches the symbol server
      # and all four target-reading assertions run. `windows-11-arm` has no `symsrv.dll` in
      # System32 at all, so a `srv*` path downloads nothing, `nt` resolves no PDB, and every one
      # of the four stands down. Both images do carry the Debugging Tools, so the half that is
      # missing is already on the runner's disk.
      #
      # It runs on **both** ARM64 entries, and what `windows-11-vs2026-arm`'s System32 holds was
      # never measured — deliberately. Copying makes the entry not depend on the answer, which is
      # the property worth having across an image migration: the one thing that must stay the
      # runner's own is `dbgeng.dll`, and that is what the next paragraph is about. If the new
      # image turns out to ship a `symsrv.dll` of its own, this step costs it two file copies.
      #
      # `dbgeng.dll` is deliberately **not** copied. The entry goes on loading the image's own
      # engine, which is the claim it was matrixed for (issue #134) and the one this repo wants to
      # hear about breaking; what it gains is the symbol half, which was measured on this
      # project's own ARM64 bench to be all an inbox engine needs (`docs/smoke-test.md`). It is
      # also exactly what `skills/windbg-debugging/setup.md` tells a user to do, so the entry moves
      # from what a bare machine gets to what a reader of this repo's setup gets.
      - name: Give the ARM64 engine its symbol half (issue #153)
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          # Through the environment rather than interpolated into the script: the value is a
          # literal from the matrix above, but a step that reads workflow expressions as PowerShell
          # source is a habit worth not having.
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          $kit = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64'
          foreach ($dll in 'dbghelp.dll', 'symsrv.dll') {
            $from = Join-Path $kit $dll
            if (-not (Test-Path $from)) {
              # A red build is the point: the runner image stopped shipping the Debugging Tools,
              # and this entry is back to asserting nothing about reading a target.
              throw "$from is missing - the $env:RUNNER_IMAGE image no longer carries the Debugging Tools"
            }
            Copy-Item $from 'target\debug' -Force
            Write-Host "copied $dll beside the binary under test"
          }

      # The 32-bit tier's gate (`FOLLOWUPS.md` item 49). It needs no variable and no supplied
      # fixture — the tier compiles a 32-bit .NET program with the `csc.exe` every stock Windows
      # ships and dumps it — but it does need the thing this repo's own release zip carries and a
      # `cargo build` does not: a 32-bit worker, with a 32-bit engine beside it, in `x86\`.
      #
      # The engine comes from the Debugging Tools' own `x86` payload where there is one, which is
      # exactly what `skills/windbg-debugging/setup.md` tells a reader to copy, and from SysWOW64
      # otherwise — measured on this project's x64 bench to be enough for this tier, which loads
      # SOS and reads a managed thread table but resolves no PDB.
      #
      # **A runner with neither is red on x64 and a stand-down on ARM64**, and the split is where
      # this repo's confidence actually is. Neither source was measured on a GitHub image — only on
      # this project's x64 bench, which has both — so the x64 entry is the one asked to *report* a
      # host with no 32-bit engine, because that is the architecture whose 32-bit half is ordinary.
      # On ARM64 an x86 engine runs under emulation and may not be shipped at all, which is new
      # ground; issue #153 is this repo's precedent for not assuming two runner images carry the
      # same things, so that entry stands the tier down instead of failing.
      - name: Give the runner a 32-bit worker and engine (item 49)
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --target i686-pc-windows-msvc
          $x86 = 'target\debug\x86'
          New-Item $x86 -ItemType Directory -Force | Out-Null
          Copy-Item 'target\i686-pc-windows-msvc\debug\windbg-mcp.exe' $x86 -Force
          $sources = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x86',
            "$env:WINDIR\SysWOW64"
          )
          $from = $sources | Where-Object { Test-Path (Join-Path $_ 'dbgeng.dll') } | Select-Object -First 1
          if (-not $from) {
            if ($env:ARCH -eq 'x64') {
              throw "no 32-bit dbgeng.dll in any of: $($sources -join ', ')"
            }
            Write-Host "no 32-bit engine on this image; the 32-bit tier will stand down"
            exit 0
          }
          foreach ($dll in 'dbgeng.dll', 'dbghelp.dll', 'dbgcore.dll', 'dbgmodel.dll') {
            $file = Join-Path $from $dll
            if (Test-Path $file) { Copy-Item $file $x86 -Force }
          }
          Write-Host "32-bit engine copied from $from"

      - name: Smoke test against the sample dump
        env:
          WINDBG_MCP_SMOKE_DUMP: "1"
        run: cargo test --test mcp_smoke -- --nocapture 2>&1 | Tee-Object -FilePath smoke.log
        shell: pwsh

      # The copy above is the only thing standing between this entry and four silent `SKIPPED`s,
      # and a skip passes. Without this check a broken copy reads exactly like a green run.
      - name: The target-reading assertions must have run
        shell: pwsh
        run: |
          # Prove the log is the log before reading anything out of it. A stand-down is printed by
          # `eprintln!`, so it is only in this file because of the `2>&1` above - and if that ever
          # stopped capturing, every check below would pass by finding nothing, which is the same
          # false green this step exists to prevent.
          if (-not (Select-String -Path smoke.log -SimpleMatch -Pattern 'test result:' -Quiet)) {
            throw 'smoke.log does not hold the test output; the checks below would pass vacuously'
          }
          $skips = Select-String -Path smoke.log -SimpleMatch -Pattern @(
            "could not read ``nt``'s own base",
            "``nt`` resolved no PDB on this host"
          )
          if ($skips) {
            $skips | ForEach-Object { Write-Host $_.Line }
            throw 'this runner stood down from reading a target; see the SKIPPED lines above'
          }
          Write-Host 'no target-read skips: the four assertions ran'

      # Same argument one tier down, and the same failure it guards against: the step above put a
      # 32-bit worker and engine in place, and if either copy stopped landing the two 32-bit tests
      # would stand down and pass. On x64 only, because that is the entry whose engine source is
      # not optional — see the copy step.
      - name: The 32-bit tier must have run
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $skip = Select-String -Path smoke.log -SimpleMatch -Pattern 'no 32-bit engine in an'
          if ($skip) {
            $skip | ForEach-Object { Write-Host $_.Line }
            throw 'the 32-bit tier stood down, so nothing here covered the 32-bit worker'
          }
          Write-Host 'the 32-bit dump and attach tests ran'

  docs:
    name: Documentation lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            README.md
            CHANGELOG.md
            docs/**/*.md
            skills/**/*.md

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Soft-warn: a freshly-disclosed advisory in a transitive dependency should
    # surface here without blocking unrelated PRs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        # Pinned to a SHA, so the tool comes from the input, not the ref.
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a master-history SHA (per the action's README — toolchain
        # branch commits get force-pushed), so the toolchain comes from the
        # input, not the ref.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Validate plugin manifests
        shell: pwsh
        run: |
          # Guard against malformed plugin/marketplace manifests (the JSON that
          # tells the marketplace how to install this plugin).
          foreach ($f in '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json') {
            Write-Host "Validating $f"
            Get-Content $f -Raw | ConvertFrom-Json | Out-Null
          }

  docs:
    name: Documentation lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            README.md
            CHANGELOG.md
            docs/**/*.md
            skills/**/*.md

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Soft-warn: a freshly-disclosed advisory in a transitive dependency should
    # surface here without blocking unrelated PRs.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        # Pinned to a SHA, so the tool comes from the input, not the ref.
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

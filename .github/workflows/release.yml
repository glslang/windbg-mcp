name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build and package, upload as a workflow artifact, no release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build & publish binary
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # sign the build-provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation in the repo
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify tag matches manifest versions
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          # The release checklist says: bump Cargo.toml + plugin.json + the
          # README release badge, then tag vX.Y.Z. Fail the release if they
          # disagree. The README badge is static, so this guard keeps it from
          # silently going stale.
          $tag    = $env:GITHUB_REF_NAME -replace '^v', ''
          $cargo  = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $plugin = (Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $readme = [regex]::Match((Get-Content README.md -Raw), 'img\.shields\.io/badge/release-v([^-]+)-').Groups[1].Value
          if ($cargo -ne $tag -or $plugin -ne $tag -or $readme -ne $tag) {
            Write-Error "Version mismatch: tag v$tag, Cargo.toml $cargo, plugin.json $plugin, README badge $readme"
          }

      - name: Install Rust toolchain
        # Pinned to a master-history SHA (per the action's README — toolchain
        # branch commits get force-pushed), so the toolchain comes from the
        # input, not the ref.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Package
        shell: pwsh
        run: |
          $ver  = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $name = "windbg-mcp-v$ver-windows-x64"
          New-Item dist -ItemType Directory | Out-Null
          Compress-Archive -Path target/release/windbg-mcp.exe, LICENSE -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/SHA256SUMS.txt "$hash  $name.zip"

      - name: Attest build provenance
        # Records a signed SLSA provenance statement linking the zip to this
        # workflow run; users verify with `gh attestation verify`.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/*.zip

      - name: Publish GitHub release
        # event_name guard: a workflow_dispatch run from a tag ref also has
        # ref_type == 'tag', and a dry run must never publish.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload artifact (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windbg-mcp-windows-x64
          path: dist/
